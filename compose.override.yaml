services:
  ###> app ###
  app:
    image: abribus-dev
    build:
      target: dev
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # ":80" écoute sur toutes les interfaces sans nom d'hôte fixe, ce qui
      # permet d'accéder à l'app depuis un autre appareil du réseau local
      # (ex: un Raspberry Pi) via l'IP LAN de la machine. Surcharger avec
      # SERVER_NAME=localhost dans .env.local pour revenir au HTTPS local
      # auto-signé si besoin.
      SERVER_NAME: ${SERVER_NAME:-:80}
      MAILER_DSN: smtp://mailer:1025
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./:/app
      # Le contenu de var/ ne doit pas venir du host (cache/logs propres au
      # conteneur). Volume réservé au dev : la prod et la CI n'en ont pas.
      - app_var:/app/var
  ###< app ###

  # Recompile la CSS Tailwind à chaque modification d'un template ou d'un
  # asset. Même image et mêmes montages que app, pour partager var/tailwind/
  # (binaire et CSS compilée) : app sert directement la CSS recompilée.
  tailwind:
    image: abribus-dev
    build:
      context: .
      target: dev
    environment:
      APP_ENV: dev
    # Pas de serveur web ici : le healthcheck de l'image ne s'applique pas.
    healthcheck:
      disable: true
    command: ["php", "bin/console", "tailwind:build", "--watch"]
    depends_on:
      - app
    volumes:
      - ./:/app
      - app_var:/app/var

  # Consomme la file async (envoi des emails). Même image et mêmes montages
  # que app : après un changement de code, `make worker-restart`.
  worker:
    image: abribus-dev
    build:
      context: .
      target: dev
    environment:
      APP_ENV: dev
      # Déclaré seulement ici : ne reçoit pas celle de app (compose.yaml).
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
      MAILER_DSN: smtp://mailer:1025
    # Pas de serveur web ici : le healthcheck de l'image ne s'applique pas.
    healthcheck:
      disable: true
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    restart: unless-stopped
    depends_on:
      # Laisse app faire le composer install du premier démarrage.
      app:
        condition: service_started
      database:
        condition: service_healthy
    volumes:
      - ./:/app
      - app_var:/app/var

  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      # Limité à la machine hôte (client BDD de l'IDE) : pas d'accès depuis le réseau local
      - "127.0.0.1:5432:5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  # Capture les emails envoyés en dev : interface web sur http://localhost:8025.
  # Le SMTP (mailer:1025) n'est joignable que depuis le réseau Docker.
  mailer:
    image: axllent/mailpit
    ports:
      # Limité à la machine hôte, comme la base.
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

volumes:
  ###> app ###
  # Garde son nom historique pour réutiliser le volume de dev existant.
  app_var:
  ###< app ###
