services:
  ###> app ###
  app:
    build:
      target: dev
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      # ":80" écoute sur toutes les interfaces sans nom d'hôte fixe, ce qui
      # permet d'accéder à l'app depuis un autre appareil du réseau local
      # (ex: un Raspberry Pi) via l'IP LAN de la machine. Surcharger avec
      # SERVER_NAME=localhost dans .env.local pour revenir au HTTPS local
      # auto-signé si besoin.
      SERVER_NAME: ${SERVER_NAME:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./:/app
      # Le contenu de var/ ne doit pas venir du host (cache/logs propres au conteneur)
      - app_var:/app/var
  ###< app ###

  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      # Limité à la machine hôte (client BDD de l'IDE) : pas d'accès depuis le réseau local
      - "127.0.0.1:5432:5432"
###< doctrine/doctrine-bundle ###

