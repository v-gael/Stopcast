services:
  ###> app ###
  app:
    build:
      target: dev
    environment:
      APP_ENV: dev
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./:/app
      # Le contenu de var/ ne doit pas venir du host (cache/logs propres au conteneur)
      - app_var:/app/var
  ###< app ###

  ###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

