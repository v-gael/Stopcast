[PHP]
memory_limit = 256M
display_errors = 0
error_reporting = E_ALL & ~E_DEPRECATED
; Pas d'arguments de fonctions dans les traces des exceptions (logs, Sentry) :
; ils peuvent porter des emails ou des mots de passe. Valeur de php.ini-production.
zend.exception_ignore_args = On
; Pas d'en-tête X-Powered-By : il donnerait la version exacte de PHP.
expose_php = Off

[opcache]
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
