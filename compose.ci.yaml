services:
  app:
    build:
      target: ci
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}_test?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "
        php bin/console doctrine:database:create --if-not-exists --env=test &&
        php bin/console doctrine:migrations:migrate --no-interaction --env=test &&
        php bin/console tailwind:build --env=test &&
        php bin/phpunit
      "

  database:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}_test
