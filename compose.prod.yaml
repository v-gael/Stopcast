services:
  app:
    build:
      target: prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
      GTFS_STATIC_FEED_URL: ${GTFS_STATIC_FEED_URL}
      GTFS_REALTIME_TRIP_UPDATES_URL: ${GTFS_REALTIME_TRIP_UPDATES_URL}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-Stopcast <no-reply@stopcast.local>}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Consomme la file async (envoi des emails). Même image que app.
  worker:
    build:
      context: .
      target: prod
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=${POSTGRES_VERSION:-16}&charset=utf8
      GTFS_STATIC_FEED_URL: ${GTFS_STATIC_FEED_URL}
      GTFS_REALTIME_TRIP_UPDATES_URL: ${GTFS_REALTIME_TRIP_UPDATES_URL}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-Stopcast <no-reply@stopcast.local>}
    # Pas de serveur web ici : le healthcheck de l'image ne s'applique pas.
    healthcheck:
      disable: true
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    depends_on:
      database:
        condition: service_healthy

  database:
    restart: unless-stopped
    volumes:
      - database_data_prod:/var/lib/postgresql/data:rw

volumes:
  database_data_prod:
