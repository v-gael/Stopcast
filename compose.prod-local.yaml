# Prod locale (make prod-up), sans cloudflared : app publie le port 80 et edge
# devient un réseau local, créé par Compose. L'image est construite sur place
# depuis les sources, sous l'étiquette IMAGE_TAG (local, fixé par le Makefile),
# au lieu d'être tirée de GHCR comme en prod.
services:
  app:
    build:
      context: .
      target: prod
    ports:
      - "80:80"

  worker:
    build:
      context: .
      target: prod

  # Dépôt restic de test, sans R2 : RESTIC_REPOSITORY=/srv/restic dans
  # .env.prod.local. Un volume, pour que les `run` de la procédure de
  # restauration (docs/exploitation.md) le voient aussi.
  backup:
    volumes:
      - restic_local:/srv/restic
    depends_on:
      restic-local-init:
        condition: service_completed_successfully

  # Un volume neuf sur un chemin absent de l'image appartient à root : il est
  # donné à www-data, qui fait tourner backup.
  restic-local-init:
    image: ghcr.io/v-gael/stopcast:${IMAGE_TAG:?IMAGE_TAG est requis}
    user: root
    command: ["chown", "www-data:www-data", "/srv/restic"]
    volumes:
      - restic_local:/srv/restic
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: ["no-new-privileges:true"]

volumes:
  restic_local:

networks:
  edge:
    external: false
