# Prod locale (make prod-up), sans cloudflared : app publie le port 80 et edge
# devient un réseau local, créé par Compose. L'image est construite sur place
# depuis les sources, sous l'étiquette IMAGE_TAG (local, fixé par le Makefile),
# au lieu d'être tirée de GHCR comme en prod.
services:
  app:
    build:
      context: .
      target: prod
    ports:
      - "80:80"

  worker:
    build:
      context: .
      target: prod

  # Dépôt restic de test, sans R2 : RESTIC_REPOSITORY=/srv/restic dans
  # .env.prod.local. En mémoire, il disparaît quand le conteneur est recréé.
  backup:
    tmpfs:
      - /srv/restic:mode=1777

networks:
  edge:
    external: false
