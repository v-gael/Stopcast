services:
  ###> app ###
  app:
    build:
      context: .
      target: prod
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8
      REDIS_URL: redis://${REDIS_PASSWORD:-!ChangeMe!}@redis:6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Pas de volume sur var/ : en prod et en CI, le cache compilé au build doit
    # venir de l'image. Un volume nommé ne se remplit depuis l'image qu'à sa
    # création et servirait un cache périmé après un rebuild. Aucune donnée
    # persistante n'y est écrite (logs sur stderr, cache applicatif jetable).
    # Le dev a son propre volume, voir compose.override.yaml.
  ###< app ###

  ###> doctrine/doctrine-bundle ###
  # Images tierces épinglées par digest, comme l'image de base du Dockerfile :
  # Dependabot propose les nouveaux digests (écosystème docker-compose),
  # audit.yml scanne ceux-ci chaque jour et bin/deploy les tire. La version
  # majeure de PostgreSQL se change à la main, ici, dans serverVersion des
  # DATABASE_URL et dans POSTGRES_VERSION du Dockerfile : bin/check-compose
  # vérifie qu'elles concordent.
  database:
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

  # État partagé par app et les workers (docs/exploitation.md, « Redis »).
  # Sans persistance (ni RDB ni AOF, pas de volume) : un redémarrage perd tout
  # son contenu. noeviction : plein, Redis refuse les écritures au lieu
  # d'effacer un compteur de limiter sans bruit.
  # Le mot de passe passe par l'entrée standard de redis-server et par
  # REDISCLI_AUTH (lu par redis-cli), jamais sur une ligne de commande visible
  # dans `ps`.
  redis:
    image: redis:8-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-!ChangeMe!}
    # exec : redis-server devient le processus 1 et reçoit le SIGTERM de Docker.
    command:
      - sh
      - -c
      - |
        exec redis-server - --save '' --appendonly no --maxmemory 64mb --maxmemory-policy noeviction <<EOF
        requirepass "$$REDISCLI_AUTH"
        EOF
    # Un peu au-dessus de maxmemory : Redis lui-même et sa fragmentation.
    mem_limit: 96m
    restart: unless-stopped
    healthcheck:
      # redis-cli sort en 0 même sur une erreur d'authentification.
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ###> symfony/mailer ###
# Mailpit et le worker qui envoie les emails ne sont déclarés qu'en dev
# (compose.override.yaml) et en prod (compose.prod.yaml) : en CI, un worker
# tournerait sans fin et bloquerait --abort-on-container-exit.
# ###< symfony/mailer ###

volumes:
  ###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
