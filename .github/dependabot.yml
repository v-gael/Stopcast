# Traitement des PR et dépendances restées à la main : docs/developpement.md,
# « Mettre à jour les dépendances ». Une vérification se lance aussi à la main
# depuis GitHub, après une alerte de Trivy (docs/exploitation.md, « Scan des
# failles (Trivy) »).
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: sunday
      time: '08:00'
      timezone: Europe/Paris
    commit-message:
      prefix: chore(deps)
    groups:
      composer:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Montées mineures et majeures à la main (recipes Flex).
      - dependency-name: symfony/*
        update-types: [version-update:semver-minor, version-update:semver-major]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: sunday
      time: '08:00'
      timezone: Europe/Paris
    commit-message:
      prefix: chore(deps)
    groups:
      docker:
        patterns: ['*']
        update-types: [minor, patch]

  # Images tierces de compose.yaml (postgres, redis) et compose.prod.yaml
  # (exporters de métriques, exporter-role), épinglées par digest.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: sunday
      time: '08:00'
      timezone: Europe/Paris
    commit-message:
      prefix: chore(deps)
    groups:
      docker-compose:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Une version majeure de PostgreSQL demande de migrer les données du
      # volume : montée à la main (docs/developpement.md).
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: sunday
      time: '08:00'
      timezone: Europe/Paris
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
