name: Audit

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Failles des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, iconv, intl, zip, pdo_pgsql
          coverage: none
          tools: composer:v2
          # Même fuseau que l'image : frankenphp/conf.d/10-timezone.ini.
          ini-values: date.timezone=Europe/Paris

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Même audit que `make audit` en local.
      - name: Audit
        run: bin/audit
