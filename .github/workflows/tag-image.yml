# Ajoute l'étiquette de version (vX.Y.Z) à l'image déjà publiée pour le commit
# du tag, sans la reconstruire : c'est l'image testée et déployée. Ne déploie
# rien, le déploiement suit le push sur main (ci.yml).
name: Étiquette de version

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tag:
    name: Étiqueter l'image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/v-gael/stopcast
    steps:
      # Historique complet : il faut main pour vérifier que le tag y est.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Vérifier le tag
        id: commit
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Le tag $GITHUB_REF_NAME ne suit pas le format vX.Y.Z."
            exit 1
          fi
          sha=$(git rev-parse "$GITHUB_REF^{commit}")
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::Le commit $sha du tag $GITHUB_REF_NAME n'est pas sur main : aucune image à étiqueter."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Le tag est souvent poussé juste après le merge, avant la fin du job
      # image de ci.yml : attendre l'image du commit, 20 minutes au plus.
      - name: Attendre l'image du commit
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          for _ in $(seq 40); do
            if docker buildx imagetools inspect "$IMAGE:$SHA" > /dev/null 2>&1; then
              echo "Image trouvée : $IMAGE:$SHA"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Image $IMAGE:$SHA introuvable après 20 minutes : vérifier le job image de ci.yml, puis relancer ce workflow."
          exit 1

      - name: Ajouter l'étiquette de version
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE:$SHA"
