framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Namespaced pools use the above "app" backend by default
        pools:
            # Flux temps réel, partagé entre tous les dispositifs (voir NextPassageFinder).
            gtfs_realtime.cache: null
            # Demandes d'appairage des écrans, quelques minutes chacune (voir ScreenPairing).
            # Sur disque en test aussi : un pool en mémoire est vidé à chaque
            # requête, et un appairage en enchaîne plusieurs. Les clés sont
            # aléatoires, rien ne déborde d'un test à l'autre.
            display_pairing.cache: null

when@test:
    framework:
        cache:
            pools:
                # En mémoire : rien ne survit d'un test à l'autre.
                gtfs_realtime.cache:
                    adapter: cache.adapter.array
                # Tentatives de connexion (login_throttling) : sans quoi les
                # échecs s'additionnent d'un test et d'un lancement à l'autre.
                cache.rate_limiter:
                    adapter: cache.adapter.array
