framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # cache.app (cache de résultats Doctrine, état du Scheduler) et les pools
        # qui en héritent (dont cache.rate_limiter, compteurs des rate limiters
        # et de login_throttling) sont sur Redis, partagé par app et worker. Redis
        # indisponible : le cache journalise et répond sans cache, les sessions
        # échouent, et les rate limiters aussi, parce que leur verrou Redis
        # (lock.yaml) lève une erreur : sans verrou, ils laisseraient passer
        # l'essai. Pas de repli sur le disque.
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'

        pools:
            # Index des passages temps réel, écrit par realtime-worker et lu par
            # app (voir PassageIndexRefresher), et heure du dernier error de
            # RealtimeFeedFailureLogger. Sur disque en test (cache.app y est sur
            # disque) : le serveur des tests navigateur, un autre processus, lit
            # l'index qu'écrit le test.
            realtime.cache: null
            # Demandes d'appairage des écrans, quelques minutes chacune (voir ScreenPairing).
            # Sur disque en test (cache.app y est sur disque) : un pool en
            # mémoire est vidé à chaque requête, et un appairage en enchaîne
            # plusieurs. Les clés sont aléatoires, rien ne déborde d'un test à l'autre.
            display_pairing.cache: null
            # ETag et Last-Modified du dernier import GTFS statique réussi (voir
            # StaticReferenceImporter). Perdu au redémarrage de Redis : au pire un import de plus.
            gtfs_static.cache: null

when@test:
    framework:
        cache:
            # Sur disque, sans Redis : seuls les tests qui en ont besoin le
            # joignent, par REDIS_URL (voir RedisRateLimiterBurstTest).
            app: cache.adapter.filesystem
            pools:
                # En mémoire : rien ne survit d'un test à l'autre.
                gtfs_static.cache:
                    adapter: cache.adapter.array
                # Tentatives de connexion (login_throttling) : sans quoi les
                # échecs s'additionnent d'un test et d'un lancement à l'autre.
                cache.rate_limiter:
                    adapter: cache.adapter.array
