symfonycasts_reset_password:
    request_password_repository: App\Repository\ResetPasswordRequestRepository
    # Durée de vie d'un lien de réinitialisation : 1 h.
    lifetime: 3600
    # La purge planifiée (app:purge) supprime les demandes expirées. Le
    # nettoyage du bundle effacerait aussi celles d'un compte en attente, qui
    # datent sa dernière invitation.
    enable_garbage_collection: false
