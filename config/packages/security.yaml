security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            # Sans « property » : UserRepository::loadUserByIdentifier()
            # normalise l'email saisi avant de chercher le compte.
            entity:
                class: App\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # L'écran d'affichage s'authentifie par le cookie reçu à l'appairage, à
        # part des comptes : une session n'ouvre pas la page d'affichage, et le
        # cookie n'ouvre pas main. Sans cookie, l'écran passe en anonyme et
        # reçoit l'écran d'appairage. « ^/display » seul attraperait
        # /display-configurations.
        display:
            pattern: ^/display(/|$)
            stateless: true
            provider: app_user_provider
            access_token:
                token_handler: App\Security\ScreenCookieHandler
                token_extractors: App\Security\ScreenCookieExtractor
                failure_handler: App\Security\ScreenCookieRejectedHandler
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                # Le formulaire de connexion est sur la vitrine.
                login_path: app_home
                check_path: app_login
                enable_csrf: true
                default_target_path: app_device_index
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours
                httponly: true
                samesite: lax
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            logout:
                path: app_logout
                target: app_home
                enable_csrf: true

    # Note: Only the *first* matching rule is applied
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/(account|devices|display-configurations), roles: ROLE_USER }
        # Le reste est public.

when@prod:
    security:
        firewalls:
            main:
                remember_me:
                    # Comme le cookie de session : Secure, Path=/, sans Domain.
                    name: __Host-REMEMBERME
                    secure: true
                    path: /

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon

        firewalls:
            main:
                login_throttling:
                    # Même stockage en mémoire que current_password (voir
                    # rate_limiter.yaml) : avec disableReboot(), le compteur
                    # tient le temps d'un test.
                    storage_service: app.rate_limiter.test_storage
