monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            # Un fichier par jour (dev-AAAA-MM-JJ.log), 7 jours gardés.
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 7
                level: info
                channels: ["!event", "!app"]
            # Le canal app reste complet dès debug, dans le même fichier.
            app:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 7
                level: debug
                channels: [app]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            # Un fichier par jour (test-AAAA-MM-JJ.log), 3 jours gardés.
            nested:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 3
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                # JSON dont la ligne finale est masquée : le processor ne
                # touche pas au message des exceptions.
                formatter: App\Logging\MaskingJsonFormatter
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            # Sentry (config/packages/sentry.yaml), hors fingers_crossed : seules
            # les erreurs partent, sans les logs qui les précèdent.
            sentry_exceptions:
                type: service
                id: Sentry\Monolog\ExceptionToSentryIssueHandler
            sentry_messages:
                type: service
                id: Sentry\Monolog\LogToSentryIssueHandler
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: App\Logging\MaskingJsonFormatter
